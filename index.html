<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR GitHub Website</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    text-align: center;
}
header {
    padding: 60px 20px;
}
h1 {
    font-size: 3em;
}
section {
    padding: 40px 20px;
}
a.button {
    display: inline-block;
    padding: 15px 25px;
    background: #38bdf8;
    color: black;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}
footer {
    margin-top: 40px;
    padding: 20px;
    background: rgba(255,255,255,0.1);
}
</style>
</head>
<body>
<header>
    <h1>Welkom bij mijn VR GitHub Website</h1>
    <p>Ontdek virtual reality projecten en code.</p>
    <a class="button" href="https://github.com/" target="_blank">Bezoek GitHub</a>
</header>

<section>
    <h2>VR Projecten</h2>
    <p>Bekijk mijn experimenten met Virtual Reality, WebXR en interactieve ervaringen.</p>
</section>

<footer>
    © 2026 VR GitHub Website
</footer>
</body>
</html>
