<!DOCTYPE html>
<html>
<head>
    <title>VR SpaceOS</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<a-scene background="color: #0a1020">

    <!-- Camera -->
    <a-entity position="0 1.6 0">
        <a-camera></a-camera>
    </a-entity>

    <!-- Browser venster -->
    <a-plane
        position="0 2 -4"
        width="2.5"
        height="1.5"
        color="#222"
        opacity="0.8">
    </a-plane>

    <a-text
        value="Browser"
        position="-1 2.6 -3.9"
        color="white">
    </a-text>

    <!-- Muziek venster -->
    <a-plane
        position="3 1.8 -5"
        width="2"
        height="1.3"
        color="#333"
        opacity="0.8">
    </a-plane>

    <a-text
        value="Spotify"
        position="2.3 2.3 -4.9"
        color="#00ff88">
    </a-text>

    <!-- Notities -->
    <a-plane
        position="-3 1.8 -5"
        width="2"
        height="1.3"
        color="#444"
        opacity="0.8">
    </a-plane>

    <a-text
        value="Notities"
        position="-3.7 2.3 -4.9"
        color="white">
    </a-text>

    <!-- Ruimte achtergrond -->
    <a-sky color="#101830"></a-sky>

</a-scene>
</body>
</html>
