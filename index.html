<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>SpaceOS VR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

</head>
<body>

<a-scene background="color:#080b1a">

    <!-- Camera -->
    <a-entity position="0 1.6 0">
        <a-camera></a-camera>
    </a-entity>

    <!-- Licht -->
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="point" position="0 5 0" intensity="2"></a-light>

    <!-- Ruimte achtergrond -->
    <a-sky color="#0a1025"></a-sky>

    <!-- ===== Browser venster ===== -->

    <a-plane
        position="0 2 -4"
        width="2.8"
        height="1.6"
        color="#222"
        opacity="0.85">

    </a-plane>

    <a-text
        value="Browser"
        color="white"
        align="center"
        width="5"
        position="0 2.7 -3.99">
    </a-text>


    <!-- ===== Spotify ===== -->

    <a-plane
        position="3 1.8 -5"
        width="2"
        height="1.3"
        color="#111"
        opacity="0.85">
    </a-plane>

    <a-text
        value="Spotify"
        color="#1DB954"
        width="4"
        align="center"
        position="3 2.4 -4.99">
    </a-text>


    <!-- ===== Notities ===== -->

    <a-plane
        position="-3 1.8 -5"
        width="2"
        height="1.3"
        color="#333"
        opacity="0.85">
    </a-plane>

    <a-text
        value="Notities"
        color="white"
        width="4"
        align="center"
        position="-3 2.4 -4.99">
    </a-text>


    <!-- ===== Dock ===== -->

    <a-plane
        position="0 0.5 -2.5"
        width="3"
        height="0.5"
        color="#555"
        opacity="0.4">
    </a-plane>


    <!-- Browser icoon -->
    <a-circle
        radius="0.12"
        color="#4285F4"
        position="-1 0.5 -2.49">
    </a-circle>

    <!-- Muziek icoon -->
    <a-circle
        radius="0.12"
        color="#1DB954"
        position="-0.5 0.5 -2.49">
    </a-circle>

    <!-- Discord -->
    <a-circle
        radius="0.12"
        color="#5865F2"
        position="0 0.5 -2.49">
    </a-circle>

    <!-- Bestanden -->
    <a-circle
        radius="0.12"
        color="#FFC107"
        position="0.5 0.5 -2.49">
    </a-circle>

    <!-- Instellingen -->
    <a-circle
        radius="0.12"
        color="#AAAAAA"
        position="1 0.5 -2.49">
    </a-circle>

</a-scene>

</body>
</html>
